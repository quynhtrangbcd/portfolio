    <!-- Google Fonts: Montserrat -->

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config based on User Design System -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#717171',
              secondary: '#515151',
              subtext: '#767676',
              content: '#ffffff',
              dark: '#202020',
              accent: {
                DEFAULT: '#f1c40f', // Sunflower Yellow
                dark: '#d4ac0d',    // Darker yellow for hover
                light: '#f7dc6f',   // Lighter yellow
                faded: '#fcf3cf'    // Very light yellow
              },
              input: '#f5f5f5'
            },
            fontFamily: {
              sans: ['Montserrat', 'sans-serif'],
            },
            borderRadius: {
              'ba': '3px',
              'modal': '6px',
            },
            boxShadow: {
              'card': '0px 5px 15px 0px rgba(0, 0, 0, 0.05)',
              'hover': '0px 10px 25px 0px rgba(0, 0, 0, 0.1)',
            }
          }
        }
      }
    </script>

    <style>
      body {
        font-family: 'Montserrat', sans-serif;
        color: #202020;
        background-color: #ffffff;
        -webkit-font-smoothing: antialiased;
      }
      /* Custom scrollbar for a cleaner look */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1; 
      }
      ::-webkit-scrollbar-thumb {
        background: #bdbdbd; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #717171; 
      }
    </style>
